<!DOCTYPE html>
<html>
<head><title>Distributed Cloud Storage</title></head>
<body>
    <h1>Welcome to Your Cloud Storage</h1>
    <p><strong>{{ space }}</strong></p>
    <a href="/logout">Logout</a>
    <hr>
    <h2>Upload File</h2>
    <form method="POST" action="/upload" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <input type="submit" value="Upload">
    </form>
    <hr>
    <h2>Your Files</h2>
    {% if files %}
    <ul>
        {% for file in files %}
        <li>
            <strong>{{ file }}</strong>
            — <a href="/download/{{ file }}">Download</a>
            — <a href="/delete/{{ file }}" onclick="return confirm('Delete {{ file }}?')">Delete</a>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No files uploaded yet.</p>
    {% endif %}
</body>
</html>
